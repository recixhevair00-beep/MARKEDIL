<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markedil.com - Network Professionale Edile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <!-- Font professionale -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-800 antialiased min-h-screen">

  <!-- VISTA 1: REGISTRAZIONE / LOGIN (VISIBILE ALL'AVVIO) -->
  <div id="authView" class="min-h-screen flex flex-col items-center justify-center px-4">
    
    <!-- Logo per Login -->
    <div class="mb-8 text-center flex flex-col items-center">
      <div class="w-14 h-14 rounded-md bg-[#1E3A8A] flex items-center justify-center text-white font-black text-2xl shadow-md border-2 border-[#1E40AF] mb-4">
        MD
      </div>
      <h1 class="font-bold text-3xl tracking-tight text-slate-900">Markedil<span class="text-[#1E3A8A]">.com</span></h1>
      <p class="text-xs text-slate-500 mt-2 font-semibold uppercase tracking-widest">Network Professionale Edile</p>
    </div>

    <!-- Card di Accesso -->
    <div class="bg-white rounded-lg shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)] border border-slate-200 w-full max-w-md p-8">
      <h2 class="text-xl font-semibold text-slate-900 mb-6 border-b border-slate-100 pb-4">Accedi o Registrati</h2>
      
      <form onsubmit="event.preventDefault(); enterDashboard();" class="space-y-5">
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Categoria Professionale</label>
          <select class="w-full bg-white border border-slate-300 rounded-md px-3 py-2.5 text-sm focus:outline-none focus:border-[#1E3A8A] focus:ring-1 focus:ring-[#1E3A8A] transition-all text-slate-700">
            <option value="">Seleziona...</option>
            <option value="impresa">Impresa Edile / Artigiano</option>
            <option value="ingegnere">Ingegnere</option>
            <option value="architetto">Architetto / Geometra</option>
            <option value="fornitore">Fornitore Materiali / Magazzino</option>
            <option value="privato">Privato / Committente</option>
          </select>
        </div>
        
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Email Aziendale o Personale</label>
          <input type="email" placeholder="nome@azienda.it" class="w-full bg-white border border-slate-300 rounded-md px-3 py-2.5 text-sm focus:outline-none focus:border-[#1E3A8A] focus:ring-1 focus:ring-[#1E3A8A] transition-all">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Password</label>
          <input type="password" placeholder="••••••••" class="w-full bg-white border border-slate-300 rounded-md px-3 py-2.5 text-sm focus:outline-none focus:border-[#1E3A8A] focus:ring-1 focus:ring-[#1E3A8A] transition-all">
        </div>

        <button type="submit" class="w-full bg-[#1E3A8A] hover:bg-[#1E40AF] text-white font-semibold py-3 rounded-md text-sm transition-colors shadow-sm mt-4">
          Entra in Markedil
        </button>
      </form>
    </div>
  </div>

  <!-- VISTA 2: BACHECA / DASHBOARD (NASCOSTA ALL'AVVIO) -->
  <div id="dashboardView" class="hidden">
    
    <!-- HEADER -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
      <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-md bg-[#1E3A8A] flex items-center justify-center text-white font-bold tracking-tighter text-sm shadow-sm border border-[#1E40AF]">MD</div>
          <span class="font-bold text-lg tracking-tight text-slate-900">Markedil</span>
        </div>
        
        <div class="flex items-center gap-5">
          <button onclick="logout()" class="text-sm text-slate-500 hover:text-slate-800 font-medium transition-colors">Esci</button>
          <button class="bg-[#1E3A8A] hover:bg-[#1E40AF] text-white font-medium px-4 py-2 rounded-md text-sm transition-colors shadow-sm flex items-center gap-2">
            <i class="fa-solid fa-plus"></i> Pubblica
          </button>
        </div>
      </div>
    </header>

    <!-- FEED PRINCIPALE -->
    <main class="max-w-2xl mx-auto px-4 py-8">
      
      <!-- BOX PUBBLICAZIONE -->
      <div class="bg-white rounded-lg shadow-sm border border-slate-200 p-5 mb-8">
        <div class="flex gap-4">
          <div class="w-10 h-10 rounded-full bg-slate-100 flex-shrink-0 flex items-center justify-center text-slate-500 border border-slate-200">
            <i class="fa-solid fa-building"></i>
          </div>
          <div class="w-full">
            <input type="text" placeholder="Condividi un aggiornamento cantiere o scrivi un bando..." class="w-full bg-transparent border-none text-slate-800 placeholder-slate-400 text-sm focus:outline-none mb-3 pt-2">
            <div class="flex items-center gap-3 pt-4 border-t border-slate-100">
              <button class="flex items-center gap-2 text-[#1E3A8A] hover:bg-blue-50 px-3 py-1.5 rounded text-sm font-medium transition-colors">
                <i class="fa-solid fa-file-signature"></i> Bando Subappalto
              </button>
              <button class="flex items-center gap-2 text-slate-600 hover:bg-slate-50 px-3 py-1.5 rounded text-sm font-medium transition-colors">
                <i class="fa-solid fa-camera"></i> Foto / Post
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- FEED VUOTO -->
      <div class="bg-white rounded-lg border border-slate-200 p-10 text-center shadow-sm">
        <div class="w-12 h-12 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-4 border border-slate-100">
          <i class="fa-solid fa-clipboard-list text-slate-400 text-xl"></i>
        </div>
        <h3 class="text-slate-900 font-semibold mb-1">La bacheca è pronta</h3>
        <p class="text-slate-500 text-sm">Nessun contenuto pubblicato. Inizia creando il tuo primo bando o aggiornamento cantiere.</p>
      </div>

    </main>
  </div>

  <!-- SCRIPT JAVASCRIPT PER CAMBIARE VISTA -->
  <script>
    function enterDashboard() {
      // Nasconde il login e mostra la bacheca
      document.getElementById('authView').classList.add('hidden');
      document.getElementById('dashboardView').classList.remove('hidden');
      window.scrollTo(0, 0);
    }
    
    function logout() {
      // Torna al login
      document.getElementById('dashboardView').classList.add('hidden');
      document.getElementById('authView').classList.remove('hidden');
      window.scrollTo(0, 0);
    }
  </script>

</body>
</html>
