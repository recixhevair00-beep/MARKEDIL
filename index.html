<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markedil.com - Cantiere & Subappalti</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen">

  <!-- HEADER / BARRA SUPERIORE -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <!-- Logo Icona MD -->
        <div class="w-10 h-10 rounded-full bg-blue-900 flex items-center justify-center text-white font-black tracking-tighter text-lg shadow-md border-2 border-blue-700">
          MD
        </div>
        <span class="font-bold text-xl tracking-tight text-slate-900">Markedil<span class="text-blue-700">.com</span></span>
      </div>
      <button class="bg-blue-700 hover:bg-blue-800 text-white font-semibold px-4 py-2 rounded-lg text-sm transition shadow-sm flex items-center gap-2">
        <i class="fa-solid fa-plus">
        </i> Pubblica Bando
      </button>
    </div>
  </header>

  <!-- CONTENUTO PRINCIPALE -->
  <main class="max-w-2xl mx-auto px-4 py-6">

    <!-- BOX CREAZIONE POST / BANDO -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 mb-6">
      <div class="flex items-center gap-3 mb-4">
        <div class="w-10 h-10 rounded-full bg-slate-200 flex items-center justify-center text-slate-500 font-bold">
          <i class="fa-solid fa-user-gear">
          </i>
        </div>
        <input type="text" placeholder="Pubblica un aggiornamento cantiere o foto..." class="w-full bg-slate-100 border-none rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600">
      </div>
      <div class="flex items-center justify-between pt-3 border-t border-slate-100 text-sm font-medium">
        <button class="flex items-center gap-2 text-blue-700 hover:bg-blue-50 px-3 py-1.5 rounded-lg transition">
          <i class="fa-solid fa-file-contract">
          </i> Pubblica Bando
        </button>
        <button class="flex items-center gap-2 text-slate-600 hover:bg-slate-100 px-3 py-1.5 rounded-lg transition">
          <i class="fa-solid fa-image">
          </i> Foto Cantiere
        </button>
      </div>
    </div>

    <!-- FEED SOCIAL (ANTEPRIMA POST) -->
    <div class="space-y-4">
      <!-- Scheda Post Demo -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-900 font-bold flex items-center justify-center">
              ED
            </div>
            <div>
              <h4 class="font-bold text-slate-900 text-sm">Edilizia Generale SRL</h4>
              <p class="text-xs text-slate-500">Bergamo • 2 ore fa</p>
            </div>
          </div>
          <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded-full">Bando Subappalto</span>
        </div>
        
        <p class="text-sm text-slate-700 mb-3">Cercasi squadra per posa cartongesso e tinteggiatura per cantiere residenziale. Circa 450 mq totali. Inizio lavori previsto a breve.</p>
        
        <div class="bg-slate-50 border border-slate-100 rounded-lg p-3 text-xs text-slate-600 grid grid-cols-2 gap-2 mb-3">
          <div><strong>Metratura:</strong> 450 mq</div>
          <div><strong>Luogo:</strong> Milano Nord</div>
          <div><strong>Inizio:</strong> 15/09/2026</div>
          <div><strong>Pagamenti:</strong> 30/60 gg</div>
        </div>

        <div class="flex items-center justify-between pt-2 border-t border-slate-100 text-xs text-slate-500 font-medium">
          <button class="hover:text-blue-700">
            <i class="fa-regular fa-comment">
            </i> Rispondi al bando
          </button>
          <button class="hover:text-blue-700">
            <i class="fa-solid fa-share">
            </i> Condividi
          </button>
        </div>
      </div>
    </div>

  </main>

</body>
</html>
